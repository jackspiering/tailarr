name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.5"
  GOLANGCI_LINT_VERSION: v2.12.2
  RUMDL_VERSION: "0.2.54"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Markdown lint (rumdl)
        run: |
          python3 -m venv /tmp/rumdl
          /tmp/rumdl/bin/pip install --quiet rumdl==${{ env.RUMDL_VERSION }}
          /tmp/rumdl/bin/rumdl check .

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download modules
        run: go mod download

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...

      - name: go test (integration, skips without Docker)
        run: go test -race -tags integration ./...

      - name: go mod tidy check
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: govulncheck
        uses: golang/govulncheck-action@0b496e91ec7ae4428c3ed2eeb4c3a40df431f2cc # v1.1.0
        with:
          go-version-input: ${{ env.GO_VERSION }}
          go-package: ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --timeout=5m

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 10
    strategy:
      matrix:
        goos: [linux]
        goarch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Derive version
        run: |
          ver=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//')
          if [ -z "$ver" ]; then
            ver=$(sed -n 's/^var Version = "\([^"]*\)".*/\1/p' internal/version/version.go)
          fi
          case "$ver" in
          [0-9]*.[0-9]*.[0-9]*) ;;
          *)
            echo "error: invalid version '$ver'" >&2
            exit 1
            ;;
          esac
          echo "VERSION=$ver" >> "$GITHUB_ENV"

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p bin
          go build -trimpath -ldflags="-s -w -X github.com/jackspiering/tailarr/internal/version.Version=$VERSION" \
            -o "bin/tailarr-${{ matrix.goos }}-${{ matrix.goarch }}" ./cmd/tailarr
          ls -la bin/

      - name: Smoke test (amd64 only)
        if: matrix.goarch == 'amd64'
        run: |
          # TUI-only binary refuses non-TTY runs; that refusal is the identity probe.
          out=$(bin/tailarr-${{ matrix.goos }}-${{ matrix.goarch }} </dev/null 2>&1 || true)
          case "$out" in
          *"Tailarr is interactive"*) ;;
          *) echo "unexpected output: $out"; exit 1 ;;
          esac

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tailarr-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bin/tailarr-${{ matrix.goos }}-${{ matrix.goarch }}
          if-no-files-found: error
          retention-days: 14
