name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    # bash -eo pipefail: a failed command anywhere in a pipeline fails the step.
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR pushes are cancelled; every main commit keeps its full run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # GO_VERSION is the toolchain that tests, scans, and ships the binaries so
  # govulncheck reports the stdlib that users actually run. go.mod keeps the
  # language floor, which the test-min job still exercises.
  GO_VERSION: "1.27.1"
  GOLANGCI_LINT_VERSION: v2.13.1
  GOVULNCHECK_VERSION: v1.8.0
  ACTIONLINT_VERSION: v1.7.12
  RUMDL_VERSION: "0.2.78"
  ZIZMOR_VERSION: "1.30.1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Release tool pins match CI
        run: |
          for key in GO_VERSION GOLANGCI_LINT_VERSION GOVULNCHECK_VERSION RUMDL_VERSION; do
            # grep fails the step when either workflow lacks the pin.
            a=$(grep -m 1 -E "^[[:space:]]+${key}:" .github/workflows/ci.yml)
            b=$(grep -m 1 -E "^[[:space:]]+${key}:" .github/workflows/release.yml)
            if [ "$a" != "$b" ]; then
              echo "pin drift for ${key}" >&2
              echo "ci:      ${a}" >&2
              echo "release: ${b}" >&2
              exit 1
            fi
          done

      - name: Markdown and workflow audit (rumdl, zizmor)
        run: |
          python3 -m venv /tmp/pytools
          /tmp/pytools/bin/pip install --quiet "rumdl==${RUMDL_VERSION}" "zizmor==${ZIZMOR_VERSION}"
          /tmp/pytools/bin/rumdl check .
          /tmp/pytools/bin/zizmor --offline --format github .github/workflows

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: actionlint
        run: go run "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}"

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go mod tidy check
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
          # git diff ignores untracked files; fail too if tidy left go.sum uncommitted.
          test -z "$(git status --porcelain -- go.mod go.sum)"

      - name: govulncheck
        run: go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --timeout=5m

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      # ubuntu-latest ships Docker and Compose v2, so the integration tests
      # run here against a real daemon. They skip on hosts without Docker.
      - name: go test (race and integration)
        run: go test -race -tags integration ./...

  test-min:
    name: Test (go.mod minimum Go)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: go test
        env:
          # Stay on the go.mod toolchain instead of auto-switching to a newer one.
          GOTOOLCHAIN: local
        run: go test ./...

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Derive version
        id: version
        run: |
          # Dev/PR builds get "<tag>-<n>-g<sha>" so they stay distinguishable from releases.
          # Without a reachable tag, fall back to the version in version.go.
          ver=$(git describe --tags 2>/dev/null | sed 's/^v//' || true)
          if [ -z "$ver" ]; then
            ver=$(sed -n 's/^var Version = "\([^"]*\)".*/\1/p' internal/version/version.go)
          fi
          if [ -z "$ver" ]; then
            echo "error: could not derive version" >&2
            exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -z "${VERSION}" ]; then
            echo "error: VERSION is empty" >&2
            exit 1
          fi
          mkdir -p bin
          go build -trimpath -ldflags="-s -w -X github.com/jackspiering/tailarr/internal/version.Version=${VERSION}" \
            -o "bin/tailarr-${{ matrix.goos }}-${{ matrix.goarch }}" ./cmd/tailarr
          ls -la bin/

      - name: Smoke test (linux amd64 only)
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          # TUI-only binary refuses non-TTY runs; that refusal is the identity probe.
          out=$(bin/tailarr-${{ matrix.goos }}-${{ matrix.goarch }} </dev/null 2>&1 || true)
          case "$out" in
          *"Tailarr is interactive"*) ;;
          *) echo "unexpected output: $out"; exit 1 ;;
          esac

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tailarr-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bin/tailarr-${{ matrix.goos }}-${{ matrix.goarch }}
          if-no-files-found: error
          retention-days: 14
