name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build assets
        env:
          CGO_ENABLED: "0"
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for goos in linux darwin; do
            for goarch in amd64 arm64; do
              GOOS=$goos GOARCH=$goarch go build -trimpath \
                -ldflags="-s -w -X github.com/jackspiering/tailarr/internal/version.Version=$version" \
                -o "dist/tailarr-$goos-$goarch" ./cmd/tailarr
            done
          done
          (cd dist && sha256sum tailarr-* > SHA256SUMS)
          ls -la dist/

      - name: Verify built binaries
        run: |
          dist/tailarr-linux-amd64 version | grep -F "tailarr ${GITHUB_REF_NAME#v}"
          file dist/tailarr-linux-arm64

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/tailarr-* dist/SHA256SUMS scripts/install.sh \
            --title "$GITHUB_REF_NAME" \
            --notes "See the CHANGELOG for details." \
            --verify-tag
